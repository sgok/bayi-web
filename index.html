// Anlık mesaj: sohbet açıksa hemen eklenir, listedeki satır hemen güncellenir (sonraki yenileme sadece doğrular)
// Gönderen ekranda liste satırı da gönderme anında güncellenir (Sugo onayı beklenmez; onay gelince asıl hâl yazılır)
function rowReact(c, e, t) { const x = inbox.find((i) => String(i.id) === String(c)); if (!x) return;
  Object.assign(x, { at: Date.now(), own: true, rx: 1, p: `${e} tepki verdiniz${t ? `: “${t}”` : ""}`, rd: 0, loc: Date.now() }); sortInbox(); renderInbox(); }
function ownRow(c, p) { const x = inbox.find((i) => String(i.id) === String(c)); if (!x) return;
  Object.assign(x, { at: Date.now(), own: true, rx: 0, p, u: "", rd: 0, loc: Date.now() }); sortInbox(); renderInbox(); }
// Sunucudaki liste birkaç saniye geride kalabilir: satırın yerelde daha yeni hâli (gönderdiğimiz / anlık gelen mesaj, okundu) varsa 2 dk boyunca korunur.
// (Yoksa yenileme eski önizlemeyi yazıyor, satır "onun mesajı ↔ bizim mesajımız" arasında gidip geliyordu.)
function mergeRows(items) { const prev = new Map(inbox.map((x) => [String(x.id), x])), now = Date.now();
  return items.map((x) => { const o = prev.get(String(x.id)); if (!o) return x; let y = x;
    if (o.loc && now - o.loc < 120_000 && (Number(o.at) || 0) > (Number(x.at) || 0)) y = { ...x, at: o.at, own: o.own, p: o.p, rd: o.rd, u: o.u, rx: o.rx, loc: o.loc };
    if (o.readAt && (Number(y.at) || 0) <= o.readAt && Number(y.u)) y = { ...y, u: "", readAt: o.readAt }; else if (o.readAt) y = { ...y, readAt: o.readAt };
    return y; }); }
// Diğer ekranın (tablet / başka telefon) gönderdiği mesaj: Sugo onaylayana kadar soluk "gönderiliyor"
let rpend = [];
function onPending(pl) { const c = String(pl.c || ""); if (!c || !pl.oid) return;
  const txt = String(pl.t || "").trim(), now = Date.now();
  const own = outbox.some((o) => o.status === "pending" && now - Date.parse(o.created_at) < 30_000 && (pl.k === "text" ? String(o.body || "").trim() === txt : o.kind === "image"));
  if (own) return; // bu ekranın kendi gönderimi: zaten kendi bekleyen balonu var
  rpend = rpend.filter((p) => now - p.at < 60_000 && p.oid !== String(pl.oid)); rpend.push({ oid: String(pl.oid), c, k: pl.k, t: txt, at: now });
  if (cur === c) renderChat(true); ownRow(c, txt); }
function liveMsg(pl) { const c = String(pl.c || ""), it = pl.item; if (pl.oid) rpend = rpend.filter((p) => p.oid !== String(pl.oid)); if (!c || !it || !it.id) return;
  if (cur === c && !hist.some((m) => String(m.id) === String(it.id))) {
    hist = applyOpt([...hist, it].sort((a, b) => Date.parse(a.at) - Date.parse(b.at)));
    if (it.m) outbox = outbox.filter((o) => !(o.kind === "text" && String(o.body || "").trim() === String(it.t || "").trim()));
    renderChat(); if (!it.m) ding(); }
  const r = pl.row, x = inbox.find((i) => String(i.id) === c);
  if (x && r && (Number(r.at) || 0) >= (x.loc ? 0 : Number(x.at) || 0)) { Object.assign(x, { at: r.at, own: r.own, rx: 0, p: r.p, u: cur === c ? "" : r.u, rd: 0, loc: Date.now() });
    sortInbox(); renderInbox(); }
  else if (!x) loadInbox(); }
function connectRt() { if (!me || !me.rt || !me.rt.url) return; try { if (rt) rt.close(); } catch (e) {}
  const ws = new WebSocket(me.rt.url.replace(/^http/, "ws") + "/realtime/v1/websocket?apikey=" + encodeURIComponent(me.rt.anon) + "&vsn=1.0.0"); rt = ws; let ref = 1, hb = 0; const hbAt = {};
  ws.onopen = () => { ws.send(JSON.stringify({ topic: "realtime:" + me.rt.topic, event: "phx_join", payload: { config: { broadcast: { self: false }, presence: { key: "" } } }, ref: String(ref++) }));
    STAT.rtOn = true; statLine(); const beat = () => { try { const r = String(ref++); hbAt[r] = performance.now(); ws.send(JSON.stringify({ topic: "phoenix", event: "heartbeat", payload: {}, ref: r })); } catch (e) {} };
    beat(); hb = setInterval(beat, 25_000); };
  ws.onmessage = (m) => { let d = {}; try { d = JSON.parse(m.data); } catch (e) {}
    if (d.event === "phx_reply" && d.topic === "phoenix" && hbAt[d.ref]) { STAT.rt = Math.round(performance.now() - hbAt[d.ref]); delete hbAt[d.ref]; statLine(); return; }
    if (d.event !== "broadcast" || !d.payload) return; const ev = d.payload.event;
    if (ev === "link") { const pl = d.payload.payload || {}; if ("pauseUntil" in pl) { const pu = Number(pl.pauseUntil) || 0; if (pu !== pauseUntil) { pauseShow(pu); if (pu > Date.now()) toast(`📱 ${pl.pauseBy ? pl.pauseBy + " " : ""}Sugo uygulamasını açtı — sunucu bekliyor`); } } return; } // başka ekran Sugo uygulaması beklemesini başlattı/bitirdi
    if (ev === "perms") { permsRefresh(); return; } // yönetici tabletten rol / izin / erişim değiştirdi
    if (ev === "cmutes") { const m = (d.payload.payload || {}).cmutes; if (m) { setCmutes(m); sortInbox(); renderInbox(); } return; }
    if (ev === "ctags") { const m = (d.payload.payload || {}).ctags; if (m) { setCtags(m); setTagx(d.payload.payload); renderInbox(); renderChTags(); } return; }
    if (ev === "typing") { onTyping(d.payload.payload || {}); return; } // ✍️ başka ekip üyesi yazıyor
    if (ev === "rem") { const m = (d.payload.payload || {}).rem; if (m) { rems = m; renderInbox(); } else loadInbox(); if (cur) loadChat(); return; } // ⏰ hatırlatma kuruldu / zamanı geldi
    if (ev === "assign") { const m = (d.payload.payload || {}).assign; if (m) { assigns = m; renderInbox(); renderChTags(); } return; }
    if (ev === "cpins") { if (setCpins(d.payload.payload || {})) { sortInbox(); renderInbox(); } return; }
    if (ev === "live") { const pl = d.payload.payload || {}; try { const at = Date.parse(pl.item && pl.item.at); if (at && !(pl.item && pl.item.m)) { STAT.live = Math.max(0, Date.now() - at); statLine(); } } catch (e) {} liveMsg(pl); return; } // sunucudan anında: mesaj + liste satırı (veritabanı beklenmez)
    if (ev === "pending") { onPending(d.payload.payload || {}); return; } // diğer ekran gönderiyor (Sugo onayı bekleniyor)
    if (ev === "pendfail") { const pl = d.payload.payload || {}; const p = rpend.find((x) => x.oid === String(pl.oid)); if (p) { p.fail = pl.err || "gitmedi"; if (cur === p.c) renderChat(); } return; }
    if (cur && (ev === "outbox" || ev === "msg")) loadChat(); if (ev === "inbox" || ev === "msg") loadInbox(); };
  ws.onclose = () => { clearInterval(hb); STAT.rtOn = false; statLine(); if (rt === ws) { rt = null; setTimeout(connectRt, 4000); } }; ws.onerror = () => { try { ws.close(); } catch (e) {} };
}
setInterval(() => { if (!tok || document.hidden) return; if (cur) loadChat(); else if (curTab === "msg") { loadInbox(); loadDm(); } }, 20_000);
setInterval(() => { if (tok && !document.hidden) loadTablet(); }, 60_000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && tok) { if (cur) loadChat(); else loadInbox(); loadTablet(); if (!rt) connectRt(); } });
$("txt").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !/iPhone|iPad|Android/.test(navigator.userAgent)) { e.preventDefault(); send(); } });

if (tok) start(); else show("login");
