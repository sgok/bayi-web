<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sugo Bayi">
<meta name="theme-color" content="#0b1512">
<meta name="robots" content="noindex, nofollow">
<title>Sugo Bayi</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏪%3C/text%3E%3C/svg%3E">
<style>
  :root { --bg: #0b1512; --panel: #12201b; --panel2: #18291f; --line: #24382f; --text: #e8f2ec; --muted: #8ea89a; --go: #16a34a; --me: #075e54; --peer: #1d2c25; --bad: #f87171; --warn: #fbbf24; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); overflow: hidden; }
  button { font: inherit; color: inherit; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; cursor: pointer; }
  button.go { background: var(--go); border-color: var(--go); color: #fff; font-weight: 700; }
  button:disabled { opacity: .45; }
  input, textarea { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; }
  .s { color: var(--muted); font-size: 13px; }
  .screen { position: fixed; inset: env(safe-area-inset-top) 0 0 0; display: none; flex-direction: column; }
  .screen.on { display: flex; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--panel); min-height: 58px; }
  header h1 { font-size: 18px; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .dot.ok { background: #22c55e; } .dot.bad { background: var(--bad); }
  .av { width: 44px; height: 44px; border-radius: 50%; flex: none; background: #334155; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; font-weight: 800; }
  .av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .row { display: flex; gap: 12px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .row .b { flex: 1; min-width: 0; }
  .row .t { display: flex; justify-content: space-between; gap: 8px; }
  .row .t b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .p { color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; gap: 6px; justify-content: space-between; }
  .badge { background: var(--go); color: #fff; border-radius: 999px; padding: 0 7px; font-size: 12px; font-weight: 700; min-width: 20px; text-align: center; }
  .un { color: #4ade80; font-weight: 700; }
  .search { padding: 8px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; }
  .trust { font-size: 12.5px; margin-top: 3px; color: var(--muted); white-space: normal; } .trust b { color: var(--text); }
  .trust.good { color: #10b981; } .trust.some { color: #fbbf24; } .trust.debt { color: #f87171; } .trust.debt b { color: #fecaca; } .trust.new { color: #94a3b8; }
  #chTrust .trust { font-size: 13.5px; padding: 6px 14px; margin: 0; border-bottom: 1px solid var(--line); }
  #srchRes:empty { display: none; } #srchRes { border-bottom: 2px solid var(--line); max-height: 60vh; overflow-y: auto; }
  #srchRes .hd { padding: 6px 14px; font-size: 12px; color: var(--muted); background: rgba(148,163,184,.08); }
  .row .av.tap { cursor: pointer; outline: 2px solid transparent; } .row .av.tap:active { outline-color: #38bdf8; }
  /* Sugo emojileri, tepkiler, mesaj menüsü (tabletteki gibi) */
  .semo { display: inline-block; vertical-align: -0.3em; background-repeat: no-repeat; }
  .emochips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; white-space: normal; } .emochips button { padding: 1px 6px; border-radius: 12px; font-size: 12px; background: #00000033; border: 1px solid #ffffff22; display: inline-flex; align-items: center; gap: 3px; } .emochips button.me { border-color: #f59e0b; }
  .msgmenu { position: absolute; left: 10px; right: 10px; bottom: 120px; z-index: 30; background: #1b2530; border: 1px solid var(--line); border-radius: 16px; padding: 10px; box-shadow: 0 10px 30px #000a; } .msgmenu[hidden] { display: none; }
  .msgmenu .mq { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; } .msgmenu .mq button { background: none; border: 0; padding: 4px; border-radius: 10px; } .msgmenu .mq button.on { background: #f59e0b44; }
  .msgmenu .ma { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; } .msgmenu .ma button { padding: 8px 12px; font-size: 15px; }
  .msgmenu .mp { font-size: 13px; color: var(--muted); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .emopanel { border-top: 1px solid var(--line); background: var(--panel); padding: 6px 8px; } .emopanel[hidden] { display: none; }
  .emotabs { display: flex; gap: 6px; margin-bottom: 6px; } .emotabs button { padding: 4px 10px; font-size: 13px; border-radius: 10px; } .emotabs button.on { background: #f59e0b; color: #111; border-color: #f59e0b; }
  .emogrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 4px; max-height: 210px; overflow-y: auto; } .emogrid button { padding: 3px; border: 0; background: none; border-radius: 8px; }
  .m[data-mid] { cursor: pointer; } .m.sel { outline: 2px solid #f59e0b; }
  .m.wdmine { opacity: .55; background: #3f4a55; color: #cbd5e1; font-style: italic; }
  .m.wd { background: #64748b22; border: 1px solid #64748b66; color: #cbd5e1; font-style: italic; } .m.wd .orig { font-style: normal; margin-top: 4px; color: #e2e8f0; }
  .coingrp { align-self: stretch; background: #1e1b4b; border: 2px solid #818cf8; border-radius: 12px; padding: 10px; font-size: 14px; } .coingrp.paid { background: #10251a; border-color: #22c55e; }
  .dmgrp { margin: 0 12px 8px; padding: 8px 10px; border: 1px dashed #818cf8; border-radius: 10px; font-size: 14px; }
  .bxdm { display: inline-block; margin-top: 3px; font-size: 12.5px; color: #c4b5fd; }
  .uidl { color: #5aa9e6; text-decoration: underline dotted; cursor: pointer; }
  #lb { position: fixed; inset: 0; background: #000e; z-index: 60; display: flex; align-items: center; justify-content: center; } #lb[hidden] { display: none; } #lb img { max-width: 100%; max-height: 100%; object-fit: contain; }
  #lb a { position: absolute; top: calc(10px + env(safe-area-inset-top)); right: 12px; background: #0008; color: #fff; padding: 8px 12px; border-radius: 10px; text-decoration: none; font-size: 14px; }
  /* Profil (tabletteki gibi) */
  #pfBody { padding: 12px 14px; } #pfBody .card { margin: 0; } #pfBody .card.empty { color: var(--muted); font-size: 14px; }
  .pgrid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); margin: 6px 0; }
  .pfh { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; } .wav { position: relative; width: 72px; height: 72px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 28px; color: #fff; overflow: visible; }
  .wav img { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; } .wav .zoomhit { position: absolute; inset: 0; border-radius: 50%; cursor: zoom-in; z-index: 1; }
  .wonl { position: absolute; right: 1px; bottom: 1px; width: 14px; height: 14px; border-radius: 50%; background: #25d366; border: 2px solid var(--bg); z-index: 2; } .wonl.off { background: #ef5d5d; }
  .pn { font-size: 20px; font-weight: 700; overflow-wrap: anywhere; } .pfold { color: var(--muted); font-weight: 500; font-size: .8em; } .pfplain { font-size: 14px; color: var(--muted); } .pfplain b { color: var(--text); }
  .vtick { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; background: #1d9bf0; color: #fff; font-size: 13px; font-weight: 800; vertical-align: 2px; }
  .pfcopy { font-size: 12px; padding: 2px 8px; } .pfuid { user-select: all; } .pfrole { color: #38bdf8; }
  .pflive { margin-top: 4px; font-size: 14px; } .pfroom { border: 1px solid #10b98155; border-radius: 10px; padding: 3px 9px; color: #10b981; font-weight: 700; display: inline-flex; gap: 6px; align-items: center; }
  .eqw { display: inline-flex; align-items: center; gap: 2px; height: 1em; } .eqw i { display: block; width: 3px; height: 30%; background: currentColor; border-radius: 2px; animation: eqw .9s ease-in-out infinite; }
  .eqw i:nth-child(2) { animation-delay: -.6s; } .eqw i:nth-child(3) { animation-delay: -.3s; } .eqw i:nth-child(4) { animation-delay: -.75s; } .eqw i:nth-child(5) { animation-delay: -.15s; } @keyframes eqw { 0%, 100% { height: 25%; } 50% { height: 100%; } }
  .pfrel { margin-top: 6px; } .relc { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 13px; color: var(--muted); } .relc.on { color: #10b981; border-color: #10b981; font-weight: 700; }
  .pflinks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; } .pflinks span { background: #2e1a4f; border: 1px solid #7c3aed55; border-radius: 10px; padding: 3px 9px; font-size: 13px; }
  .pftags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; } .pftags span { background: #ffffff14; border-radius: 999px; padding: 2px 9px; font-size: 13px; }
  .pfmsg { display: block; width: 100%; margin: 0 0 12px; padding: 13px; font-size: 17px; font-weight: 700; border-radius: 14px; background: #059669; border-color: #059669; color: #fff; }
  .pfjump { display: flex; flex-wrap: wrap; gap: 8px; margin: -4px 0 12px; } .pfjump button { flex: 1 1 auto; font-size: 14px; padding: 8px 10px; }
  .pfbio { white-space: pre-wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 0 0 8px; overflow-wrap: anywhere; }
  .pfsec { margin: 16px 0 6px; font-weight: 700; color: var(--muted); font-size: 14px; }
  .pfbars { display: flex; gap: 3px; align-items: flex-end; height: 60px; padding: 4px 0; } .pfbars i { flex: 1; background: #059669; border-radius: 3px 3px 0 0; min-height: 2px; }
  .frames { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; } .frames div { font-size: 12px; color: var(--muted); text-align: center; }
  .frames img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 10px; background: #000; cursor: zoom-in; display: block; }
  .allinfo { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px 12px 10px; } .kvt { font-size: 12px; font-weight: 700; color: var(--muted); margin: 10px 0 4px; text-transform: uppercase; }
  .kv > div { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-top: 1px solid var(--line); font-size: 14px; } .kv > div:first-child { border-top: 0; } .kv span { color: var(--muted); flex: none; } .kv b { text-align: right; font-weight: 600; overflow-wrap: anywhere; }
  .raw summary { cursor: pointer; color: var(--muted); font-size: 13px; margin-top: 10px; } .raw pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 11px; max-height: 300px; overflow: auto; }
  .hist { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; } .hrow { padding: 10px 12px; } .hrow + .hrow { border-top: 1px solid var(--line); }
  .hh { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; } .hv { margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; } .ho { color: var(--muted); text-decoration: line-through; }
  .havs { display: flex; align-items: center; gap: 10px; margin-top: 6px; } .havs img, .havs .hph { width: 84px; height: 84px; border-radius: 10px; object-fit: cover; background: #000; } .havs .hph { display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--muted); }
  #pfBody table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; font-size: 14px; }
  #pfBody th, #pfBody td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); } #pfBody th { color: var(--muted); font-size: 12px; } #pfBody .n { text-align: right; } .cause { padding: 6px 0; border-bottom: 1px solid var(--line); }
  .msgs { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
  .m { max-width: 82%; padding: 7px 10px 5px; border-radius: 12px; background: var(--peer); align-self: flex-start; overflow-wrap: anywhere; white-space: pre-wrap; }
  .m.me { background: var(--me); align-self: flex-end; }
  .m.pend { opacity: .6; } .m.fail { border: 1px solid var(--bad); }
  .m img { max-width: 100%; max-height: 360px; min-height: 120px; object-fit: cover; border-radius: 8px; display: block; background: #0f1a16; }
  .m .tm { font-size: 11px; color: #b6c8be; text-align: right; margin-top: 2px; }
  .day { align-self: center; font-size: 12px; color: var(--muted); background: var(--panel); padding: 2px 10px; border-radius: 999px; margin: 6px 0; }
  .coin { align-self: stretch; background: #2a2210; border: 1px solid #a16207; border-radius: 12px; padding: 10px; font-size: 14px; }
  .coin.paid { background: #10251a; border-color: #166534; }
  .tpl { display: flex; gap: 6px; overflow-x: auto; padding: 6px 10px; border-top: 1px solid var(--line); -webkit-overflow-scrolling: touch; }
  .tpl button { white-space: nowrap; font-size: 14px; padding: 8px 12px; flex: none; }
  .comp { display: flex; gap: 8px; align-items: flex-end; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--panel); }
  .comp textarea { resize: none; max-height: 120px; min-height: 44px; }
  .comp button { flex: none; min-height: 44px; }
  .cards { display: none; grid-template-columns: 1fr; gap: 6px; padding: 8px 10px; max-height: 40vh; overflow-y: auto; border-top: 1px solid var(--line); }
  .cards.on { display: grid; }
  .cards button { text-align: left; font-weight: 700; padding: 12px; }
  .cards button.full { text-decoration: line-through; opacity: .45; }
  .cards button.next { border-color: #d97706; color: #fbbf24; }
  #login { align-items: center; justify-content: center; gap: 16px; padding: 24px; }
  #login .pin { font-size: 28px; letter-spacing: 10px; text-align: center; max-width: 260px; }
  #toast { position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top)); transform: translateX(-50%); background: #1f3a2d; border: 1px solid var(--line); padding: 10px 16px; border-radius: 12px; z-index: 50; display: none; max-width: 92vw; }
  #toast.bad { background: #3a1f1f; }
  .warnbar { background: #3a2f12; color: #ffe9b0; padding: 8px 12px; font-size: 14px; display: none; }
  nav.bn { display: flex; border-top: 1px solid var(--line); background: var(--panel); padding-bottom: env(safe-area-inset-bottom); }
  nav.bn button { flex: 1; border: 0; border-radius: 0; background: none; padding: 8px 2px 10px; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative; }
  nav.bn button b { font-size: 20px; } nav.bn button.on { color: #4ade80; }
  nav.bn i { position: absolute; top: 2px; right: 22%; background: var(--bad); color: #fff; font-style: normal; font-size: 11px; border-radius: 999px; padding: 0 5px; }
  .pane { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; display: none; }
  .pane.on { display: block; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin: 10px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px; }
  .grid .card { margin: 0; } .k { color: var(--muted); font-size: 12px; } .v { font-size: 20px; font-weight: 700; }
  h3 { margin: 14px 12px 6px; font-size: 16px; }
  .sub { display: flex; gap: 6px; overflow-x: auto; padding: 8px 10px; }
  .sub button { white-space: nowrap; flex: none; font-size: 14px; padding: 7px 12px; } .sub button.on { background: var(--go); border-color: var(--go); color: #fff; }
  table { width: calc(100% - 20px); margin: 0 10px; border-collapse: collapse; font-size: 14px; } td, th { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: left; } td.n, th.n { text-align: right; } th { color: var(--muted); font-weight: 600; font-size: 12px; }
  .sys { background: rgba(217,70,239,.08); }
  .dmstrip { margin: 8px 10px; padding: 10px 12px; border-radius: 12px; background: #2a2210; border: 1px solid #a16207; font-size: 14px; }
  .systabs { display: flex; gap: 6px; overflow-x: auto; padding: 6px 10px; border-bottom: 1px solid var(--line); }
  .systabs button { white-space: nowrap; flex: none; font-size: 13px; padding: 6px 10px; } .systabs button.on { background: #db2777; border-color: #db2777; color: #fff; }
  .ro { text-align: center; padding: 14px; color: var(--muted); border-top: 1px solid var(--line); }
</style>
</head>
<body>
<div id="toast"></div>
<div id="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;align-items:flex-end;justify-content:center">
  <div id="modalBox" style="background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom))"></div>
</div>

<section class="screen" id="login">
  <div style="font-size:42px">🏪</div>
  <h2 style="margin:0">Sugo Bayi</h2>
  <div class="s">Şifrenizle girin</div>
  <input id="pin" type="password" autocomplete="current-password" placeholder="Şifre" style="max-width:280px;text-align:center;font-size:20px">
  <button class="go" style="min-width:200px" onclick="doLogin()">Giriş</button>
</section>

<section class="screen" id="inbox">
  <header><div style="font-size:24px">🏪</div><h1 id="hTitle" onclick="tab('coin')" style="cursor:pointer" title="Coin bakiyemiz · dokun: Coins">🪙 <span id="hStock">…</span></h1><span id="tabDot" class="dot" title="Tablet"></span><button onclick="refreshTab()">↻</button><button onclick="menu()">⚙️</button></header>
  <div class="warnbar" id="tabWarn"></div>
  <div id="notifBar" style="display:none;padding:10px 12px;background:#12233a;border-bottom:1px solid var(--line);font-size:14px"></div>
  <div class="pane on" id="p-msg">
    <div id="dmStrip"></div>
    <div class="search"><input id="idIn" type="search" autocomplete="off" placeholder="🔎 İsim ya da UID ile ara / sohbet aç" oninput="srch()" onkeydown="if(event.key==='Enter')openById()"><button onclick="openById()">Aç</button></div>
    <div id="srchRes"></div>
    <div id="convs"><div class="row s">Yükleniyor…</div></div>
  </div>
  <div class="pane" id="p-dm"><div id="dmBody"><div class="row s">Yükleniyor…</div></div></div>
  <div class="pane" id="p-card"><div id="cardBody"><div class="row s">Yükleniyor…</div></div></div>
  <div class="pane" id="p-coin"><div id="coinBody"><div class="row s">Yükleniyor…</div></div></div>
  <div class="pane" id="p-aj"><div id="ajBody"><div class="row s">Yükleniyor…</div></div></div>
  <nav class="bn"><button data-p="msg" class="on" onclick="tab('msg')"><b>💬</b>Sohbetler<i id="nMsg" hidden></i></button><button data-p="dm" onclick="tab('dm')"><b>💎</b>Elmas<i id="nDm" hidden></i></button><button data-p="card" onclick="tab('card')"><b>💳</b>Kartlar</button><button data-p="coin" onclick="tab('coin')"><b>🪙</b>Coins</button><button data-p="aj" onclick="tab('aj')"><b>🏢</b>Ajans</button></nav>
</section>

<section class="screen" id="prof">
  <header><button onclick="profClose()">‹</button><h1 id="pfTitle">👤 Profil</h1><span id="pfSync" class="s" hidden>🔄 Sugo'dan tazeleniyor…</span></header>
  <div class="list" id="pfBody"></div>
</section>
<div id="lb" hidden onclick="lbClose(event)"><img id="lbImg" alt=""><a id="lbOpen" href="#" target="_blank" onclick="event.stopPropagation()">↗ Aç</a></div>
<section class="screen" id="chat">
  <header><button onclick="back()">‹</button><div class="av" id="chAv" onclick="if(cur&&!isSys(cur))prof(cur)" style="cursor:pointer"></div><h1 id="chName" onclick="if(cur&&!isSys(cur))prof(cur)" style="cursor:pointer"></h1><button id="coinBtn" onclick="coinOpen()" style="border-color:#f59e0b;color:#fbbf24;font-weight:800;padding:8px 10px">🪙 Yükle</button></header>
  <div id="chTrust"></div>
  <div class="warnbar" id="tabWarn2"></div>
  <div class="systabs" id="sysTabs" hidden></div>
  <div class="msgs" id="msgs"></div>

// ---------- 💎 parça parça elmas bozumu: aynı kişinin aralarında en fazla 2 dk olan bozumları tek grup (toplam + ödenecek) — tabletle aynı
const DM_GAP = 2 * 60_000;
function dmGroups(rows) {

  for (const r of asc) { const g = out.find((x) => String(x.uid) === String(r.uid) && Date.parse(r.at) - Date.parse(x.last) <= DM_GAP);
    if (g) { g.rows.push(r); g.last = r.at; } else out.push({ uid: r.uid, rows: [r], last: r.at }); }
  for (const g of out) { g.coins = g.rows.reduce((t, r) => t + Number(r.amount), 0); g.diamonds = Math.round(g.coins / 0.36);
    g.exact = Math.round(g.coins / 1000 * 33 / 36 * 100) / 100; g.pay = Math.floor(g.exact + 1e-6);
    g.paid = g.rows.every((r) => r.paid_at); g.unpaid = g.rows.filter((r) => !r.paid_at); g.key = g.rows[0].tx; g.name = g.rows[0].nickname || g.uid; }
  return out;
}
function dmGroupLine(g) {
  return `🧮 <b>Toplam ${g.rows.length} parça: ${nf(g.diamonds)} elmas</b> → ${nf(g.coins)} coin · ` + (g.paid ? `<span style="color:#4ade80;font-weight:800">✅ hepsi ödendi</span> · ${azn(g.pay)}`
    : `toplam ödenecek <b>${azn(g.pay)}</b>${g.exact !== g.pay ? ` <span class="s">(${azn(g.exact)})</span>` : ""}${g.unpaid.length < g.rows.length ? ` · ${g.unpaid.length} parça ödenmedi` : ""}
      <button class="go" style="padding:5px 10px;font-size:13px;margin-top:4px" onclick="event.stopPropagation();coinPaidAll('${esc(JSON.stringify(g.unpaid.map((r) => r.tx)))}','${esc(g.name + " · " + g.rows.length + " parça · " + azn(g.pay))}')">💸 Hepsini ödendi yap</button>`);
}

  const url = await shrink(f); if (!url) { toast("Resim okunamadı", true); return; }
  outbox.unshift({ id: "tmp" + Date.now(), kind: "image", status: "pending", created_at: new Date().toISOString() }); renderChat(true);

function shrink(file) { return new Promise((res) => { const img = new Image(); const u = URL.createObjectURL(file);
  img.onload = () => { const k = Math.min(1, 1280 / Math.max(img.width, img.height)); const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);

function unlockAudio() { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch (e) {} }
document.addEventListener("touchstart", unlockAudio, { once: true, passive: true }); document.addEventListener("click", unlockAudio, { once: true });
function ding() { try { unlockAudio(); if (!actx) return; const t0 = actx.currentTime;
  [[880, 0], [1320, 0.12]].forEach(([f, dt]) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = "sine"; o.frequency.value = f; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(0.0001, t0 + dt); g.gain.exponentialRampToValueAtTime(0.35, t0 + dt + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + 0.25); o.start(t0 + dt); o.stop(t0 + dt + 0.3); }); } catch (e) {} }
let lastIncoming = Number(localStorage.getItem("bw_last") || 0);
function checkNew(list) { const mx = Math.max(0, ...list.filter((x) => Number(x.u) > 0 && !x.own).map((x) => Number(x.at) || 0));
  if (mx > lastIncoming) { if (lastIncoming) ding(); lastIncoming = mx; try { localStorage.setItem("bw_last", String(mx)); } catch (e) {} } }
if ("serviceWorker" in navigator) navigator.serviceWorker.addEventListener("message", (e) => { const m = e.data || {};
  if (m.kind === "push") { ding(); if (cur) loadChat(); else { loadInbox(); loadDm(); } }
  if (m.kind === "open" && m.url) { const u = new URL(m.url); const c = u.searchParams.get("c"), tt = u.searchParams.get("t"); if (c) openChat(c); else if (tt) { back(); tab(tt); } } });

// ---------- anlık güncelleme (yeni mesaj / gönderim sonucu) + yedek yoklama
function connectRt() { if (!me || !me.rt || !me.rt.url) return; try { if (rt) rt.close(); } catch (e) {}
  const ws = new WebSocket(me.rt.url.replace(/^http/, "ws") + "/realtime/v1/websocket?apikey=" + encodeURIComponent(me.rt.anon) + "&vsn=1.0.0"); rt = ws; let ref = 1, hb = 0;
  ws.onopen = () => { ws.send(JSON.stringify({ topic: "realtime:" + me.rt.topic, event: "phx_join", payload: { config: { broadcast: { self: false }, presence: { key: "" } } }, ref: String(ref++) }));
    hb = setInterval(() => { try { ws.send(JSON.stringify({ topic: "phoenix", event: "heartbeat", payload: {}, ref: String(ref++) })); } catch (e) {} }, 25_000); };
  ws.onmessage = (m) => { let d = {}; try { d = JSON.parse(m.data); } catch (e) {} if (d.event !== "broadcast" || !d.payload) return; const ev = d.payload.event;
    if (cur && (ev === "outbox" || ev === "msg")) loadChat(); if (ev === "inbox" || ev === "msg") loadInbox(); };
  ws.onclose = () => { clearInterval(hb); if (rt === ws) { rt = null; setTimeout(connectRt, 4000); } }; ws.onerror = () => { try { ws.close(); } catch (e) {} };
}
setInterval(() => { if (!tok || document.hidden) return; if (cur) loadChat(); else if (curTab === "msg") { loadInbox(); loadDm(); } }, 20_000);
setInterval(() => { if (tok && !document.hidden) loadTablet(); }, 60_000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && tok) { if (cur) loadChat(); else loadInbox(); loadTablet(); if (!rt) connectRt(); } });
$("txt").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !/iPhone|iPad|Android/.test(navigator.userAgent)) { e.preventDefault(); send(); } });

if (tok) start(); else show("login");
