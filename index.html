    if (ev === "room_msgs") { if (window.odaMsgsSet) odaMsgsSet(pl); return; } // 💬 tabletteki Selçuk oturumu odada: oda sohbeti (açılınca son 50, sonra yalnız yeniler)
    if (ev === "room_say_ok") { if (window.odaSayOk) odaSayOk(pl); return; } // ✍️ panelden oda sohbetine yazma: tablet gönderdi / gönderemedi
    if (ev === "room_mode") { if (window.odaModeSet) odaModeSet(pl); return; } // 📹 bayi odası kamera / sesli moda geçti (sunucu dakikada bir bakar)
    if (ev === "pausereq") { onPauseReq(pl); return; } // 📨 Sugo uygulaması onay isteği (yeni / onaylandı / reddedildi / süresi doldu)
    if (ev === "pcards") { loadCards(); if ($("ocBody") && ocEdit === null && !ocBulk) ocLoad(); return; } // kartlar değişti (tablet / ajans sahibi)
    if (ev === "perms") { permsRefresh(); return; } // yönetici tabletten rol / izin / erişim değiştirdi
    if (ev === "cmutes") { const m = pl.cmutes; if (m) { setCmutes(m); sortInbox(); renderInbox(); } return; }
    if (ev === "alias") { if (pl && pl.alias) { setAliases(pl.alias); aliasShow(); } return; } // 🏷️ başka ekrandan takma ad
    if (ev === "ctags") { const m = pl.ctags; if (m) { setCtags(m); setTagx(pl); renderInbox(); renderChTags(); } return; }
    if (ev === "typing") { onTyping(pl); return; } // ✍️ başka ekip üyesi yazıyor
    if (ev === "clock") { if (pl && pl.c) clockSet(String(pl.c), pl); return; } // 🔒 biri bu müşteriye yazdı: 2 dk kilit (kendim yazdıysam kalkar)
    if (ev === "rem") { const m = pl.rem; if (m) { rems = m; renderInbox(); } else schedInbox(); if (cur) schedChat(); return; } // ⏰ hatırlatma kuruldu / zamanı geldi
    if (ev === "assign") { const m = pl.assign; if (m) { assigns = m; renderInbox(); renderChTags(); } return; }
    if (ev === "hidden") { onHidden(pl); return; } // 🙈 ajans sahibi bir mesajı gizledi / gizlemeyi kaldırdı
    if (ev === "cpins") { if (setCpins(pl)) { sortInbox(); renderInbox(); } return; }
    if (ev === "live") { try { const at = Date.parse(pl.item && pl.item.at); if (at && !(pl.item && pl.item.m)) { STAT.live = Math.max(0, Date.now() - at); statLine(); } } catch (e) {} liveMsg(pl); return; } // sunucudan anında: mesaj + liste satırı (veritabanı beklenmez)
    if (ev === "pending") { onPending(pl); return; } // diğer ekran gönderiyor (Sugo onayı bekleniyor)
    if (ev === "pendfail") { onPendFail(pl); return; }
    if (ev === "read") { onRead(pl); return; } // ✓✓ karşı taraf okudu
    if (ev === "outbox") { if (!onOutboxEv(pl) && cur && !liveFresh(cur)) schedChat(); return; }
    if (ev === "msg") { const cv = Array.isArray(pl.convs) ? pl.convs.map(String) : null; // yalnız açık sohbet etkilendiyse; canlı eklenen mesajın yankısı (5 sn içinde, mesaj başına bir kez) yenileme yapmaz
      if (cur && (!cv || cv.includes("b" + cur) || cv.includes(cur))) { if (liveFresh(cur) && liveEcho[cur] > 0) liveEcho[cur]--; else { liveEcho[cur] = 0; schedChat(); } } schedInbox(); return; }
    if (ev === "inbox") schedInbox(); };
  ws.onclose = () => { clearInterval(hb); clearTimeout(wd); rtDown(ws); }; ws.onerror = () => { try { ws.close(); } catch (e) {} };
}
// Yedek yoklama: açık sohbette canlı bağlantı sağlıklıysa (son cevap < 40 sn) 60 sn'de bir, değilse (ve listede) 20 sn'de bir; bu arada zaten yenilendiyse sayaç baştan (gereksiz istek yok)
let pollAt = Date.now();
const rtHealthy = () => !!(rt && rt.readyState === 1 && STAT.rtOn && Date.now() - rtLast < 40_000);
setInterval(() => { if (!tok || document.hidden || Date.now() - pollAt < (cur && rtHealthy() ? 60_000 : 20_000) - 500) return; pollAt = Date.now();
  if (cur) loadChat(); else if (curTab === "msg") { loadInbox(); loadDm(); } }, 5_000);
setInterval(() => { if (tok && !document.hidden) loadTablet(); }, 60_000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && tok) { if (cur) { schedChat(); openRead(); } else schedInbox(); loadTablet(); rtWake(); } });
addEventListener("pageshow", () => { if (tok) rtWake(); }); addEventListener("online", () => { if (tok) { rtWake(); if (cur) schedChat(); else schedInbox(); } });
$("txt").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !/iPhone|iPad|Android/.test(navigator.userAgent)) { e.preventDefault(); send(); } });

if (tok) start(); else { show("login"); pushDrop(); } // 🔕 girişsiz telefona bildirim gelmesin
