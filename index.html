<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sugo Bayi">
<meta name="theme-color" content="#0b1512">
<meta name="robots" content="noindex, nofollow">
<title>Sugo Bayi</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏪%3C/text%3E%3C/svg%3E">
<style>
  :root { --bg: #0b1512; --panel: #12201b; --panel2: #18291f; --line: #24382f; --text: #e8f2ec; --muted: #8ea89a; --go: #16a34a; --me: #075e54; --peer: #1d2c25; --bad: #f87171; --warn: #fbbf24; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); overflow: hidden; }
  button { font: inherit; color: inherit; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; cursor: pointer; }
  button.go { background: var(--go); border-color: var(--go); color: #fff; font-weight: 700; }
  button:disabled { opacity: .45; }
  input, textarea { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; }
  .s { color: var(--muted); font-size: 13px; }
  .screen { position: fixed; inset: env(safe-area-inset-top) 0 0 0; display: none; flex-direction: column; }
  .screen.on { display: flex; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--panel); min-height: 58px; }
  header h1 { font-size: 18px; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .dot.ok { background: #22c55e; } .dot.bad { background: var(--bad); }
  .av { width: 44px; height: 44px; border-radius: 50%; flex: none; background: #334155; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; font-weight: 800; }
  .av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .row { display: flex; gap: 12px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .row .b { flex: 1; min-width: 0; }
  .row .t { display: flex; justify-content: space-between; gap: 8px; }
  .row .t b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .p { color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; gap: 6px; justify-content: space-between; }
  .badge { background: var(--go); color: #fff; border-radius: 999px; padding: 0 7px; font-size: 12px; font-weight: 700; min-width: 20px; text-align: center; }
  .un { color: #4ade80; font-weight: 700; }
  .search { padding: 8px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; }
  .msgs { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
  .m { max-width: 82%; padding: 7px 10px 5px; border-radius: 12px; background: var(--peer); align-self: flex-start; overflow-wrap: anywhere; white-space: pre-wrap; }
  .m.me { background: var(--me); align-self: flex-end; }
  .m.pend { opacity: .6; } .m.fail { border: 1px solid var(--bad); }
  .m img { max-width: 100%; border-radius: 8px; display: block; }
  .m .tm { font-size: 11px; color: #b6c8be; text-align: right; margin-top: 2px; }
  .day { align-self: center; font-size: 12px; color: var(--muted); background: var(--panel); padding: 2px 10px; border-radius: 999px; margin: 6px 0; }
  .coin { align-self: stretch; background: #2a2210; border: 1px solid #a16207; border-radius: 12px; padding: 10px; font-size: 14px; }
  .coin.paid { background: #10251a; border-color: #166534; }
  .tpl { display: flex; gap: 6px; overflow-x: auto; padding: 6px 10px; border-top: 1px solid var(--line); -webkit-overflow-scrolling: touch; }
  .tpl button { white-space: nowrap; font-size: 14px; padding: 8px 12px; flex: none; }
  .comp { display: flex; gap: 8px; align-items: flex-end; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--panel); }
  .comp textarea { resize: none; max-height: 120px; min-height: 44px; }
  .comp button { flex: none; min-height: 44px; }
  .cards { display: none; grid-template-columns: 1fr; gap: 6px; padding: 8px 10px; max-height: 40vh; overflow-y: auto; border-top: 1px solid var(--line); }
  .cards.on { display: grid; }
  .cards button { text-align: left; font-weight: 700; padding: 12px; }
  .cards button.full { text-decoration: line-through; opacity: .45; }
  .cards button.next { border-color: #d97706; color: #fbbf24; }
  #login { align-items: center; justify-content: center; gap: 16px; padding: 24px; }
  #login .pin { font-size: 28px; letter-spacing: 10px; text-align: center; max-width: 260px; }
  #toast { position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top)); transform: translateX(-50%); background: #1f3a2d; border: 1px solid var(--line); padding: 10px 16px; border-radius: 12px; z-index: 50; display: none; max-width: 92vw; }
  #toast.bad { background: #3a1f1f; }
  .warnbar { background: #3a2f12; color: #ffe9b0; padding: 8px 12px; font-size: 14px; display: none; }
  nav.bn { display: flex; border-top: 1px solid var(--line); background: var(--panel); padding-bottom: env(safe-area-inset-bottom); }
  nav.bn button { flex: 1; border: 0; border-radius: 0; background: none; padding: 8px 2px 10px; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative; }
  nav.bn button b { font-size: 20px; } nav.bn button.on { color: #4ade80; }
  nav.bn i { position: absolute; top: 2px; right: 22%; background: var(--bad); color: #fff; font-style: normal; font-size: 11px; border-radius: 999px; padding: 0 5px; }
  .pane { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; display: none; }
  .pane.on { display: block; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin: 10px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px; }
  .grid .card { margin: 0; } .k { color: var(--muted); font-size: 12px; } .v { font-size: 20px; font-weight: 700; }
  h3 { margin: 14px 12px 6px; font-size: 16px; }
  .sub { display: flex; gap: 6px; overflow-x: auto; padding: 8px 10px; }
  .sub button { white-space: nowrap; flex: none; font-size: 14px; padding: 7px 12px; } .sub button.on { background: var(--go); border-color: var(--go); color: #fff; }
  table { width: calc(100% - 20px); margin: 0 10px; border-collapse: collapse; font-size: 14px; } td, th { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: left; } td.n, th.n { text-align: right; } th { color: var(--muted); font-weight: 600; font-size: 12px; }
  .sys { background: rgba(217,70,239,.08); }
  .dmstrip { margin: 8px 10px; padding: 10px 12px; border-radius: 12px; background: #2a2210; border: 1px solid #a16207; font-size: 14px; }
  .systabs { display: flex; gap: 6px; overflow-x: auto; padding: 6px 10px; border-bottom: 1px solid var(--line); }
  .systabs button { white-space: nowrap; flex: none; font-size: 13px; padding: 6px 10px; } .systabs button.on { background: #db2777; border-color: #db2777; color: #fff; }
  .ro { text-align: center; padding: 14px; color: var(--muted); border-top: 1px solid var(--line); }
</style>
</head>
<body>
<div id="toast"></div>

<section class="screen" id="login">
  <div style="font-size:42px">🏪</div>
  <h2 style="margin:0">Sugo Bayi</h2>
  <div class="s">Size verilen PIN ile girin</div>
  <input id="pin" class="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="one-time-code">
  <button class="go" style="min-width:200px" onclick="doLogin()">Giriş</button>
</section>

<section class="screen" id="inbox">
  <header><div style="font-size:24px">🏪</div><h1 id="hTitle">Sugo Bayi</h1><span id="tabDot" class="dot" title="Tablet"></span><button onclick="refreshTab()">↻</button><button onclick="logout()">Çıkış</button></header>
  <div class="warnbar" id="tabWarn"></div>
  <div id="notifBar" style="display:none;padding:10px 12px;background:#12233a;border-bottom:1px solid var(--line);font-size:14px"></div>
  <div class="pane on" id="p-msg">
    <div id="dmStrip"></div>
    <div class="search"><input id="idIn" inputmode="numeric" placeholder="UID ile sohbet aç" onkeydown="if(event.key==='Enter')openById()"><button onclick="openById()">Aç</button></div>
    <div id="convs"><div class="row s">Yükleniyor…</div></div>
  </div>
  <div class="pane" id="p-dm"><div id="dmBody"><div class="row s">Yükleniyor…</div></div></div>
  <div class="pane" id="p-card"><div id="cardBody"><div class="row s">Yükleniyor…</div></div></div>
  <div class="pane" id="p-aj"><div id="ajBody"><div class="row s">Yükleniyor…</div></div></div>
  <nav class="bn"><button data-p="msg" class="on" onclick="tab('msg')"><b>💬</b>Sohbetler<i id="nMsg" hidden></i></button><button data-p="dm" onclick="tab('dm')"><b>💎</b>Elmas<i id="nDm" hidden></i></button><button data-p="card" onclick="tab('card')"><b>💳</b>Kartlar</button><button data-p="aj" onclick="tab('aj')"><b>🏢</b>Ajans</button></nav>
</section>

<section class="screen" id="chat">
  <header><button onclick="back()">‹</button><div class="av" id="chAv"></div><h1 id="chName"></h1></header>
  <div class="warnbar" id="tabWarn2"></div>
  <div class="systabs" id="sysTabs" hidden></div>
  <div class="msgs" id="msgs"></div>
  <div class="ro" id="roBar" hidden>🔒 Sistem mesajları – salt okunur</div>
  <div class="cards" id="cards"></div>
  <div id="compWrap">
    <div class="tpl" id="tpls"></div>
    <div class="comp">
      <button onclick="pickImg()" title="Resim">📎</button>
      <input type="file" id="file" accept="image/*" hidden onchange="sendImg(this)">
      <textarea id="txt" rows="1" placeholder="Mesaj yazın…" autocorrect="off" autocapitalize="sentences" oninput="grow(this)"></textarea>
      <button class="go" onclick="send()">Gönder</button>
    </div>
  </div>
</section>

<script>
const API = "https://pspgaetjwmejfgouacbx.supabase.co/functions/v1/bayi-web";
const OSS = "https://oss-image.erikujnzxcgaer.xyz/";
let tok = localStorage.getItem("bw_tok") || "", me = null, rt = null, inbox = [], cur = null, curName = "", hist = [], coins = [], outbox = [], tpls = [], pcs = { cards: [], current: null };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function toast(t, bad) { const e = $("toast"); e.textContent = t; e.className = bad ? "bad" : ""; e.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(() => e.style.display = "none", bad ? 5000 : 2500); }
function show(id) { document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("on", s.id === id)); }
async function api(action, body = {}) {
  const r = await fetch(API, { method: "POST", headers: { "content-type": "application/json", "x-web-token": tok }, body: JSON.stringify({ action, ...body }) }).catch(() => null);
  if (!r) return { error: "Bağlantı yok" };
  if (r.status === 401) { tok = ""; localStorage.removeItem("bw_tok"); show("login"); return { error: "Oturum kapandı, tekrar giriş yapın" }; }
  return await r.json().catch(() => ({ error: "Yanıt okunamadı" }));
}
const whoPaid = (n) => { const s = String(n || ""); if (!s || s.startsWith("toplu:")) return ""; const w = s.startsWith("tablet") ? "Selçuk" : s.replace(/\s*\(toplu\)$/, ""); return ` (${esc(w)})`; };
const initial = (n) => esc(((n || "?").normalize("NFKC").replace(/[^\p{L}\p{N}]/gu, "").match(/./u) || ["?"])[0].toUpperCase());
const avUrl = (a) => !a ? "" : /^https?:/.test(a) ? a : OSS + a + "?x-oss-process=image/resize,m_fill,h_120,w_120";
const avHtml = (n, a) => initial(n) + (a ? `<img src="${esc(avUrl(a))}" loading="lazy" onerror="this.remove()">` : "");
function rel(ms) { if (!ms) return ""; const d = new Date(ms), now = new Date(); const hm = d.toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
  if (d.toDateString() === now.toDateString()) return hm; const y = new Date(now - 864e5); if (d.toDateString() === y.toDateString()) return "Dün " + hm; return d.toLocaleDateString("tr-TR", { day: "2-digit", month: "2-digit" }); }

// ---------- giriş
async function doLogin() { const pin = $("pin").value.trim(); if (!pin) return;
  const d = await api("login", { pin }); if (d.error || !d.token) { toast(d.error || "Giriş olmadı", true); return; }
  tok = d.token; localStorage.setItem("bw_tok", tok); $("pin").value = ""; start(); }
$("pin").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
async function logout() { if (!confirm("Çıkış yapılsın mı?")) return; await api("logout"); tok = ""; localStorage.removeItem("bw_tok"); show("login"); }

async function start() {
  const d = await api("me"); if (d.error) { show("login"); return; }
  me = d; show("inbox"); tab(curTab); loadInbox(); loadDm(); connectRt(); notifSetup();
  const qp = new URLSearchParams(location.search); if (qp.get("c")) openChat(qp.get("c")); else if (qp.get("t")) tab(qp.get("t"));
  if (location.search) history.replaceState(null, "", location.pathname);
  api("bayi_templates").then((r) => { tpls = (r.report && r.report.templates) || []; renderTpls(); });
}

// ---------- tablet durumu (mesajları tablet gönderir)
async function loadTablet() { const d = await api("tablet"); const age = Date.now() - (d.at || 0);
  const ok = d.bayi_on !== false && d.linked && age < 120_000; $("tabDot").className = "dot " + (ok ? "ok" : "bad");
  const msg = d.bayi_on === false ? "⏸ Sugo Bayi kapalı – mesaj gönderilemez." : !d.linked ? "⚠️ Tablette bayi hesabı bağlı değil – mesajlar gitmez." : age > 120_000 ? `⚠️ Tablet ${Math.round(age / 60000)} dk'dır okumuyor (kapalı ya da internet yok). Yazdıklarınız tablet açılınca gider.` : "";
  ["tabWarn", "tabWarn2"].forEach((id) => { $(id).textContent = msg; $(id).style.display = msg ? "block" : "none"; }); }

// ---------- sohbet listesi
async function loadInbox() { const d = await api("bayi_inbox_get"); if (d.error) { toast(d.error, true); return; }
  inbox = ((d.report && d.report.inbox && d.report.inbox.items) || []).filter((x) => !/^300\d\d$/.test(String(x.id)));
  inbox.sort((a, b) => (Number(b.u) > 0) - (Number(a.u) > 0) || (b.at || 0) - (a.at || 0)); checkNew(inbox); renderInbox(); }
const SYS = [["30000", "SUGO TEAM", "📢", "#db2777"], ["30003", "Sistem Asistanı", "⚙️", "#6366f1"], ["30005", "Ajans Asistanı", "🏢", "#0ea5e9"], ["30006", "Yayıncı Asistanı", "🎙", "#f59e0b"], ["30004", "Etkinlik Asistanı", "🎉", "#10b981"], ["30001", "Oyun Asistanı", "🎮", "#8b5cf6"], ["30007", "SVIP Asistanı", "👑", "#eab308"]];
const isSys = (id) => /^300\d\d$/.test(String(id));
function renderInbox() {
  const unread = inbox.reduce((s, x) => s + (Number(x.u) || 0), 0); $("nMsg").hidden = !unread; $("nMsg").textContent = unread;
  const teamRow = `<div class="row sys" onclick="openChat('30000')"><div class="av" style="background:linear-gradient(135deg,#e879f9,#db2777)">📢</div><div class="b"><div class="t"><b>SUGO TEAM <span class="s">· sistem mesajları 🔒</span></b></div><div class="p"><span>Sugo'nun resmi bildirimleri ve kodlar</span></div></div></div>`;
  $("convs").innerHTML = teamRow + (inbox.length ? inbox.slice(0, 120).map((x) => `<div class="row" onclick="openChat('${esc(x.id)}')">
    <div class="av">${avHtml(x.n, x.av)}</div>
    <div class="b"><div class="t"><b>${esc(x.n || x.id)}</b><span class="${Number(x.u) ? "un" : "s"}">${esc(x.at ? rel(x.at) : x.t || "")}</span></div>
      <div class="p"><span>${x.own ? (x.rd ? "✓✓ " : "✓ ") : ""}${esc(x.p || "—")}</span>${Number(x.u) ? `<span class="badge">${esc(x.u)}</span>` : ""}</div></div></div>`).join("")
    : `<div class="row s">Sohbet yok (tablet bayi listesini henüz göndermedi).</div>`); }
function openById() { const v = ($("idIn").value.match(/\d{5,12}/) || [])[0]; if (!v) { toast("Geçerli bir UID yazın", true); return; } $("idIn").value = ""; openChat(v); }

// ---------- sohbet
async function openChat(id) {
  cur = String(id); const x = inbox.find((i) => String(i.id) === cur) || {}; const sy = SYS.find((s) => s[0] === cur); curName = sy ? sy[1] : x.n || cur;
  $("chName").textContent = sy ? "📢 SUGO TEAM" + (cur !== "30000" ? " › " + sy[1] : "") : curName; $("chAv").innerHTML = sy ? sy[2] : avHtml(curName, x.av); $("chAv").style.background = sy ? sy[3] : "";
  $("sysTabs").hidden = !sy; $("roBar").hidden = !sy; $("compWrap").hidden = !!sy;
  if (sy) $("sysTabs").innerHTML = SYS.map(([i, n, ic]) => `<button class="${i === cur ? "on" : ""}" onclick="openChat('${i}')">${ic} ${esc(n)}</button>`).join("");
  hist = []; coins = []; outbox = []; $("msgs").innerHTML = `<div class="day">Yükleniyor…</div>`; $("cards").classList.remove("on");
  if (!$("chat").classList.contains("on")) history.pushState({ c: cur }, ""); show("chat"); await loadChat(true);
  if (Number(x.u) && !sy) { api("read", { conv: cur }); x.u = ""; renderInbox(); }
}
function back() { cur = null; show("inbox"); loadInbox(); loadDm(); }
window.addEventListener("popstate", () => { if (cur) { cur = null; show("inbox"); loadInbox(); } });
async function loadChat(scroll) { if (!cur) return; const c = cur;
  const [h, o] = await Promise.all([api("chat_history", { conv: "b" + c }), isSys(c) ? Promise.resolve({ outbox: [] }) : api("outbox", { conv: c })]);
  if (c !== cur) return;
  if (h.report) { const before = hist.length ? hist[hist.length - 1].id : null; hist = h.report.chat || []; coins = h.report.coins || [];
    const last = hist[hist.length - 1]; if (before && last && last.id !== before && !last.m) ding(); }
  outbox = o.outbox || []; renderChat(scroll); }
function bubbleBody(m) { const t = String(m.t || "");
  if ((m.k === "image" || /^https?:\/\/\S+\.(jpe?g|png|webp|gif)(\?\S*)?$/i.test(t)) && /^https?:/.test(t)) return `<a href="${esc(t)}" target="_blank"><img src="${esc(t)}" loading="lazy"></a>`;
  return esc(t || "[" + (m.k || "mesaj") + "]"); }
function renderChat(scroll) {
  const box = $("msgs"), atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  const items = hist.map((m) => ({ at: Date.parse(m.at), html: `<div class="m ${m.m ? "me" : ""}">${bubbleBody(m)}<div class="tm">${m.m && m.by ? `<b>(${esc(m.by)})</b> ` : ""}${rel(Date.parse(m.at))}</div></div>` }));
  for (const c of coins) items.push({ at: Date.parse(c.at), html: `<div class="coin ${c.paid_at ? "paid" : ""}">💎 ${c.other ? `<b>Başka hesaptan:</b> ${esc(c.nickname || "")} (UID ${esc(c.uid || "")})<br>` : ""}<b>${Number(c.diamonds || 0).toLocaleString("tr-TR")} elmas</b> bozdurdu → ${Number(c.amount || 0).toLocaleString("tr-TR")} coin<br>
      ${c.paid_at ? `✅ Ödendi ${esc(String(c.pay_azn))} ₼${whoPaid(c.paid_note)} <button style="padding:4px 10px;font-size:13px" onclick="coinPaid('${esc(c.tx)}',false)">geri al</button>` : `⏳ Ödenmedi · ödenecek <b>${esc(String(c.pay_azn))} ₼</b> <button class="go" style="padding:6px 12px;font-size:14px" onclick="coinPaid('${esc(c.tx)}',true)">💸 Ödendi yap</button>`}
      <div class="s">${rel(Date.parse(c.at))} · sadece sizde görünür</div></div>` });
  // Sayfadan gönderilenler: tablet gönderene kadar soluk, hata olursa kırmızı (gönderilen mesaj Sugo'dan gelince listede asıl hâli görünür)
  const sentTexts = new Set(hist.filter((m) => m.m).slice(-40).map((m) => String(m.t || "").trim()));
  for (const o of outbox) {
    if (o.status === "sent" && (o.kind === "image" || sentTexts.has(String(o.body || "").trim()))) continue;
    const st = o.status === "failed" ? `❌ gitmedi: ${esc(o.error || "")}` : o.status === "sent" ? "✓ gönderildi" : "⏳ tablet gönderiyor…";

setInterval(() => { if (!tok || document.hidden) return; if (cur) loadChat(); else if (curTab === "msg") { loadInbox(); loadDm(); } }, 20_000);
setInterval(() => { if (tok && !document.hidden) loadTablet(); }, 60_000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && tok) { if (cur) loadChat(); else loadInbox(); loadTablet(); if (!rt) connectRt(); } });
$("txt").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !/iPhone|iPad|Android/.test(navigator.userAgent)) { e.preventDefault(); send(); } });

if (tok) start(); else show("login");
