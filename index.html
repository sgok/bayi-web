  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } /* iPhone uzun satırları kendiliğinden büyütmesin (listede bazı mesajlar iri görünüyordu) */
  /* 🎨 Tema: varsayılan "Sugo" (koyu mor + altın sarısı); "Karanlık" = eski yeşil-siyah görünüm (⚙️ Ayarlar'dan) */
  :root { --bg: #140b25; --panel: #1e1236; --panel2: #2a1a4a; --line: #3b2766; --text: #f4effd; --muted: #ab9fcc; --go: #f5b40b; --go2: #ffd84d; --gofg: #2b1700; --me: #6d28d9; --peer: #2b1c4c; --bad: #f87171; --warn: #fbbf24; --accent: #fbbf24; --img: #1b1030;

  /* Sayfa arka planı = alt menü rengi: iPhone'un küçülttüğü alanın altındaki şerit bu renkle boyanır → alt menünün devamı gibi görünür; ekranlar kendi zeminini çizer */

  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); overflow: hidden; }
  /* iPhone ana ekran uygulaması tam ekran: html/body "border-box" olursa body'nin üst güvenli boşluğu %100 yüksekliğin içine sıkışır, sayfa ekrandan kısa kalır ve iPhone görünen alanı 59 pt kısa açar (altta boşluk). "content-box" ile body ekrandan bir çentik boyu uzun olur → iPhone tam ekranı kullanır. Simülatörde VT5 (border-box) 793 / VT6 (content-box) 852 ile doğrulandı */

// 📱 Sugo uygulamasından bayi hesabına girilecek (ör. yeni kızları onaylamak): sunucu 2 dk bağlanmaz, uygulamayı atmaz; süre bitince ya da "Bitti" ile geri bağlanır
let pauseT = 0;
async function linkPause(min) { closeModal(); const d = await api("link_pause", { minutes: min }); if (d.error) { toast("❌ " + d.error, true); return; }

  const tick = () => { const s = Math.max(0, Math.round((until - Date.now()) / 1000));
    if (!s) { clearInterval(pauseT); el.hidden = true; toast("🔌 Sunucu yeniden bağlanıyor — Sugo uygulamasından çıkış yapın"); return; }
    el.hidden = false; el.innerHTML = `📱 Sunucu bekliyor <b>${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}</b> · Sugo uygulamasını kullanabilirsiniz, bitince çıkış yapın <button onclick="linkPause(0)">✅ Bitti</button>`; };
  tick(); pauseT = setInterval(tick, 1000); }
